plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'io.github.mcengine'
version = '1.7.3'

description = 'Vault is a Chat, Permissions & Economy API to allow plugins to more easily hook into these systems without needing to hook each individual system themselves.'

def spigotApiVersion = '1.21.1-R0.1-SNAPSHOT'

configurations {
    vaultApi {
        canBeConsumed = false
        canBeResolved = true
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/groups/public/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public' }
    maven {
        url = 'http://nexus.hc.to/content/repositories/pub_releases/'
        allowInsecureProtocol = true
    }
    maven {
        url = 'http://nexus.hc.to/content/repositories/pub_snapshots/'
        allowInsecureProtocol = true
    }
    maven {
        url = 'http://dev.escapecraft.com/maven'
        allowInsecureProtocol = true
    }
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:${spigotApiVersion}"

    vaultApi 'net.milkbowl.vault:VaultAPI:1.7'

    implementation 'org.bstats:bstats-bukkit:3.0.0'

    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    compileOnly fileTree(dir: 'lib', include: ['*.jar'])
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['.']
            include 'plugin.yml'
        }
    }
}

tasks.processResources {
    filteringCharset = 'UTF-8'

    filesMatching('plugin.yml') {
        expand(
                project: [
                        name       : project.name,
                        version    : project.version,
                        description: project.description,
                        url        : 'https://github.com/MCEngine/Vault'
                ],
                mainClass: "${project.group}.vault.Vault",
                env: System.getenv()
        )
    }
}

tasks.register('shadowVaultApiJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName.set('VaultAPI')
    archiveClassifier.set('relocated')
    configurations = [project.configurations.vaultApi]
    relocate 'net.milkbowl.vault', 'io.github.mcengine.vault'
}

dependencies {
    compileOnly files(tasks.named('shadowVaultApiJar').map { it.archiveFile })
}

tasks.compileJava {
    dependsOn tasks.named('shadowVaultApiJar')
}

tasks.shadowJar {
    archiveClassifier.set('')
    relocate 'org.bstats', 'io.github.mcengine.vault.metrics'
    from(zipTree(tasks.named('shadowVaultApiJar').get().archiveFile.get().asFile))
}

tasks.jar {
    enabled = false
}

tasks.build {
    dependsOn tasks.shadowJar
}
