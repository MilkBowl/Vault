################################################################################
# INTERNAL PROJECT PROPERTIES
#
# This file manages the versions and naming for all Vault modules.
# - Use 'SNAPSHOT' for active development.
# - Use 'rc.1', 'rc.2' for release candidates.
# - Use 'RELEASE' for stable releases.
################################################################################

# --- Project Identity ---
project-group=io.github.mcengine
# Updated keys to match the mcextension naming style
git-org-name=MCEngine
git-org-repository=vault

# --- Global Versioning ---
# New iteration key used by the dynamic versioning logic
project-iteration=1

# Base version used by buildSrc VersionCalculator
project-version=2026.0.3

# Module-specific version consumed by VersionCalculator
vault-vault-version=2026.0.3
